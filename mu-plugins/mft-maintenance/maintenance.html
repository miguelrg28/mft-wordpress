  .tag {
    display: inline-block; margin-bottom: 12px; padding: 2px 10px; border-radius: 999px;

  }
  /* Divisor: dos líneas que se desvanecen hacia los lados con un rombo de acento al centro. */

  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; }
  .divider::before { background: linear-gradient(to right, transparent, #FF0055); }
  .divider::after { background: linear-gradient(to left, transparent, #FF0055); }
  .divider span {
    width: 9px; height: 9px; background: #FF0055; transform: rotate(45deg);
    box-shadow: 0 0 12px rgba(255, 0, 85, .6);
  }
  @media (min-width: 480px) { h1 { font-size: 32px; } }
